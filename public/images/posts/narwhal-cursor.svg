<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="title desc">
  <title id="title">Cute narwhal cursor</title>
  <desc id="desc">A tiny smiling narwhal with a pointed horn for use as a website cursor.</desc>
  <defs>
    <linearGradient id="body" x1="13" y1="51" x2="47" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#68a9bb"/>
