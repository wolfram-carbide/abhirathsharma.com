<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Athens Airbnb Rating Distribution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
  <style>
    :root {
      --page-bg: #FAF9F7;
      --text-primary: #1A1410;
      --text-secondary: #6B5E54;
      --text-tertiary: #9E918A;
      --copper: #C17F59;
      --copper-light: #E8D5C4;
      --muted-bar: #D0C8C0;
      --muted-border: #B8B0A8;
      --navy: #2c5282;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page-bg: #1C1714;
        --text-primary: #F0EAE4;
        --text-secondary: #B5A89E;
        --text-tertiary: #7A6E68;
        --copper: #D4956F;
        --copper-light: #3D2E22;
        --muted-bar: #3D3530;
        --muted-border: #5A4F48;
        --navy: #5A7FBE;
      }
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      background: var(--page-bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text-primary);
    }

    body { padding: 20px 16px 16px; }

    .chart-title {
      font-size: clamp(14px, 2.5vw, 18px);
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .chart-subtitle {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(10px, 1.6vw, 12px);
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      margin-bottom: 14px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: clamp(10px, 1.6vw, 12px);
      color: var(--text-secondary);
    }

    .legend-swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .chart-canvas-wrapper {
      position: relative;
      width: 100%;
      height: 340px;
    }

    @media (max-width: 400px) {
      .chart-canvas-wrapper { height: 280px; }
    }

    .stats-row {
      display: flex;
      gap: 24px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .stat {
      font-family: 'IBM Plex Mono', monospace;
      font-size: clamp(9px, 1.5vw, 11px);
      color: var(--text-tertiary);
      line-height: 1.6;
    }

    .stat strong {
      color: var(--copper);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <h2 class="chart-title">Athens Airbnb rating distribution</h2>
  <p class="chart-subtitle">Histogram of review scores for Athens listings, 0.1-point bins</p>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-swatch" style="background: var(--muted-bar); border: 1px solid var(--muted-border);"></div>
      <span>Below 4.5 — sparse</span>
    </div>
    <div class="legend-item">
      <div class="legend-swatch" style="background: var(--copper);"></div>
      <span>4.5 and above — clustered</span>
    </div>
  </div>

  <div class="chart-canvas-wrapper">
    <canvas id="ratingChart"></canvas>
  </div>

  <div class="stats-row">
    <span class="stat">Listings: <strong>13,241</strong></span>
    <span class="stat">Median: <strong>4.87</strong></span>
    <span class="stat">Mean: <strong>4.76</strong></span>
    <span class="stat">Middle 50%: <strong>4.71–4.98</strong></span>
  </div>

  <script>
    Chart.register(window['chartjs-plugin-annotation']);
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    let chart = null;

    const bins = [
      { label: '1.0', count: 43 },  { label: '1.1', count: 0 },
      { label: '1.2', count: 0 },   { label: '1.3', count: 0 },
      { label: '1.4', count: 0 },   { label: '1.5', count: 2 },
      { label: '1.6', count: 0 },   { label: '1.7', count: 0 },
      { label: '1.8', count: 0 },   { label: '1.9', count: 0 },
      { label: '2.0', count: 23 },  { label: '2.1', count: 0 },
      { label: '2.2', count: 0 },   { label: '2.3', count: 2 },
      { label: '2.4', count: 0 },   { label: '2.5', count: 8 },
      { label: '2.6', count: 1 },   { label: '2.7', count: 3 },
      { label: '2.8', count: 5 },   { label: '2.9', count: 0 },
      { label: '3.0', count: 73 },  { label: '3.1', count: 1 },
      { label: '3.2', count: 3 },   { label: '3.3', count: 13 },
      { label: '3.4', count: 3 },   { label: '3.5', count: 50 },
      { label: '3.6', count: 40 },  { label: '3.7', count: 25 },
      { label: '3.8', count: 39 },  { label: '3.9', count: 13 },
      { label: '4.0', count: 287 }, { label: '4.1', count: 79 },
      { label: '4.2', count: 161 }, { label: '4.3', count: 205 },
      { label: '4.4', count: 271 }, { label: '4.5', count: 746 },
      { label: '4.6', count: 1059 },{ label: '4.7', count: 1602 },
      { label: '4.8', count: 2693 },{ label: '4.9', count: 2697 },
      { label: '5.0', count: 3107 },
    ];

    const total = bins.reduce((s, b) => s + b.count, 0);
    const threshold = 4.5;

    function getColors() {
      const dark = mq.matches;
      return {
        copper:       dark ? '#D4956F' : '#C17F59',
        copperBorder: dark ? '#B87A58' : '#A66947',
        muted:        dark ? '#3D3530' : '#D0C8C0',
        mutedBorder:  dark ? '#5A4F48' : '#B8B0A8',
        grid:         dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)',
        tick:         dark ? '#7A6E68' : '#9E918A',
        tooltipBg:    dark ? '#2E2520' : '#FFFFFF',
        tooltipTitle: dark ? '#F0EAE4' : '#1A1410',
        tooltipBody:  dark ? '#B5A89E' : '#6B5E54',
        tooltipBorder:dark ? '#D4956F' : '#C17F59',
        annotation:   dark ? 'rgba(212,149,111,0.7)' : 'rgba(193,127,89,0.75)',
        annotationMed:dark ? 'rgba(180,160,150,0.5)' : 'rgba(120,100,90,0.5)',
      };
    }

    function buildChart() {
      const c = getColors();

      const bgColors = bins.map(b => parseFloat(b.label) >= threshold ? c.copper : c.muted);
      const borderColors = bins.map(b => parseFloat(b.label) >= threshold ? c.copperBorder : c.mutedBorder);

      const ctx = document.getElementById('ratingChart').getContext('2d');
      if (chart) { chart.destroy(); chart = null; }

      chart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: bins.map(b => b.label),
          datasets: [{
            data: bins.map(b => b.count),
            backgroundColor: bgColors,
            borderColor: borderColors,
            borderWidth: 1,
            borderRadius: 2,
            categoryPercentage: 0.95,
            barPercentage: 1.0,
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: { padding: { top: 24, right: 8 } },
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: c.tooltipBg,
              titleColor: c.tooltipTitle,
              bodyColor: c.tooltipBody,
              borderColor: c.tooltipBorder,
              borderWidth: 1,
              cornerRadius: 6,
              padding: { x: 12, y: 8 },
              displayColors: false,
              titleFont: { family: "'DM Sans', sans-serif", size: 13, weight: '600' },
              bodyFont: { family: "'IBM Plex Mono', monospace", size: 11 },
              callbacks: {
                title: items => 'Rating ' + items[0].label,
                label: item => ' ' + item.raw.toLocaleString() + ' listings',
                afterLabel: item => ' ' + ((item.raw / total) * 100).toFixed(1) + '% of total',
              },
            },
            annotation: {
              annotations: {
                superhostLine: {
                  type: 'line',
                  xMin: '4.8',
                  xMax: '4.8',
                  borderColor: c.annotation,
                  borderWidth: 1.5,
                  borderDash: [4, 4],
                  label: {
                    display: true,
                    content: 'Superhost ≥4.8',
                    font: { family: "'IBM Plex Mono', monospace", size: 9 },
                    color: c.annotation,
                    backgroundColor: 'transparent',
                    position: 'start',
                    yAdjust: 4,
                    xAdjust: -2,
                  },
                },
                medianLine: {
                  type: 'line',
                  xMin: '4.9',
                  xMax: '4.9',
                  borderColor: c.annotationMed,
                  borderWidth: 1.5,
                  borderDash: [4, 4],
                  label: {
                    display: true,
                    content: 'Guest Fav ≥4.9',
                    font: { family: "'IBM Plex Mono', monospace", size: 9 },
                    color: c.annotationMed,
                    backgroundColor: 'transparent',
                    position: 'start',
                    yAdjust: 18,
                    xAdjust: -2,
                  },
                },
              },
            },
          },
          scales: {
            x: {
              grid: { display: false },
              border: { display: false },
              ticks: {
                font: { family: "'IBM Plex Mono', monospace", size: window.innerWidth < 480 ? 8 : 10 },
                color: c.tick,
                maxRotation: 0,
                callback: (val, idx) => {
                  const label = bins[idx].label;
                  return ['1.0','2.0','3.0','4.0','4.5','4.8','4.9','5.0'].includes(label) ? label : '';
                },
              },
            },
            y: {
              grid: { color: c.grid },
              border: { display: false },
              ticks: {
                font: { family: "'IBM Plex Mono', monospace", size: window.innerWidth < 480 ? 9 : 11 },
                color: c.tick,
                maxTicksLimit: 5,
                callback: v => v >= 1000 ? (v/1000).toFixed(1) + 'k' : v,
              },
            },
          },
        },
      });
    }

    buildChart();
    mq.addEventListener('change', buildChart);
    window.addEventListener('resize', buildChart);
  </script>
</body>
</html>
